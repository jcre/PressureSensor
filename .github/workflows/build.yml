name: Test & build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Signed with the debug key, so it can be side-loaded but not published.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: raft-pressure-apk
          path: build/app/outputs/flutter-apk/app-release.apk
